<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 820"
  role="img"
  aria-labelledby="svg-title svg-desc"
>
<title id="svg-title">IAM-04 Identity Governance Architecture</title>
<desc id="svg-desc">Microsoft Entra Entitlement Management lifecycle from access request and approval through recurring certification and automatic revocation.</desc>

<style>
.bg {
  fill: #161b21;
}
.panel {
  fill: #12161b;
  stroke: #655236;
  stroke-width: 1;
}
.node {
  fill: #1b1916;
  stroke: #9c7433;
  stroke-width: 1.2;
}
.title {
  fill: #efcf88;
  font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-anchor: middle;
}
.label {
  fill: #f2eee7;
  font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-anchor: middle;
}
.sub {
  fill: #a89f92;
  font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-anchor: middle;
}
.note {
  fill: #a89f92;
  font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.arrow {
  stroke: #d4aa55;
  stroke-width: 2.5;
  fill: none;
}
</style>

<defs>
  <marker
    id="arrowhead"
    markerWidth="8"
    markerHeight="8"
    refX="6"
    refY="3"
    orient="auto"
  >
    <path d="M0,0 L0,6 L6,3 z" fill="#d4aa55"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="820"/>

    <rect class="panel" x="35" y="30" width="425" height="760"/>
    <text class="title" x="247.5" y="66">
      GOVERNED ACCESS GRANT
    </text>
  <rect class="node" x="85" y="95" width="325" height="88"/><text class="label" x="247.5" y="128"><tspan x="247.5">Taylor Brooks</tspan></text><text class="sub" x="247.5" y="153"><tspan x="247.5">Requests access through My Access</tspan></text><line
    class="arrow"
    x1="247.5"
    y1="183"
    x2="247.5"
    y2="215"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="85" y="223" width="325" height="105"/><text class="label" x="247.5" y="256"><tspan x="247.5">Finance Systems Access</tspan></text><text class="sub" x="247.5" y="281"><tspan x="247.5">Access package + business justification</tspan></text><line
    class="arrow"
    x1="247.5"
    y1="328"
    x2="247.5"
    y2="360"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="85" y="368" width="325" height="88"/><text class="label" x="247.5" y="401"><tspan x="247.5">Jordan Lee</tspan></text><text class="sub" x="247.5" y="426"><tspan x="247.5">Business approval + justification</tspan></text><line
    class="arrow"
    x1="247.5"
    y1="456"
    x2="247.5"
    y2="488"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="85" y="496" width="325" height="88"/><text class="label" x="247.5" y="529"><tspan x="247.5">Entitlement Management</tspan></text><text class="sub" x="247.5" y="554"><tspan x="247.5">Creates 30-day governed assignment</tspan></text><line
    class="arrow"
    x1="247.5"
    y1="584"
    x2="247.5"
    y2="616"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="85" y="624" width="325" height="88"/><text class="label" x="247.5" y="657"><tspan x="247.5">Resources Provisioned</tspan></text><text class="sub" x="247.5" y="682"><tspan x="247.5">SG-Finance + LedgerFlow</tspan></text>
    <rect class="panel" x="500" y="30" width="425" height="760"/>
    <text class="title" x="712.5" y="66">
      CERTIFICATION &amp; REVOCATION
    </text>
  <rect class="node" x="550" y="95" width="325" height="88"/><text class="label" x="712.5" y="128"><tspan x="712.5">Monthly Access Review</tspan></text><text class="sub" x="712.5" y="153"><tspan x="712.5">Jordan reviews continued business need</tspan></text><line
    class="arrow"
    x1="712.5"
    y1="183"
    x2="712.5"
    y2="215"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="550" y="223" width="325" height="88"/><text class="label" x="712.5" y="256"><tspan x="712.5">Deny Decision</tspan></text><text class="sub" x="712.5" y="281"><tspan x="712.5">Temporary Finance need is complete</tspan></text><line
    class="arrow"
    x1="712.5"
    y1="311"
    x2="712.5"
    y2="343"
