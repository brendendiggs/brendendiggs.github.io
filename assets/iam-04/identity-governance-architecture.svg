  /><rect class="node" x="550" y="351" width="325" height="88"/><text class="label" x="712.5" y="384"><tspan x="712.5">Review Results Applied</tspan></text><text class="sub" x="712.5" y="409"><tspan x="712.5">Identity Governance processes decision</tspan></text><line
    class="arrow"
    x1="712.5"
    y1="439"
    x2="712.5"
    y2="471"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="550" y="479" width="325" height="105"/><text class="label" x="712.5" y="512"><tspan x="712.5">Assignment Expired</tspan></text><text class="sub" x="712.5" y="537"><tspan x="712.5">Taylor's access package assignment expires</tspan></text><line
    class="arrow"
    x1="712.5"
    y1="584"
    x2="712.5"
    y2="616"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="550" y="624" width="325" height="88"/><text class="label" x="712.5" y="657"><tspan x="712.5">Access Revoked</tspan></text><text class="sub" x="712.5" y="682"><tspan x="712.5">SG-Finance + LedgerFlow removed</tspan></text>
    <text class="note" x="523" y="770">
      No manual group or enterprise-application removal was used.
    </text>
  
</svg>