    </text>
  <rect class="node" x="55" y="925" width="250" height="150"/><text class="label" x="180" y="958"><tspan x="180">Joiner</tspan></text><text class="sub" x="180" y="983"><tspan x="180">Create account · attributes</tspan><tspan x="180" dy="19">department group · SG-All-Employees</tspan><tspan x="180" dy="19">assign Entra ID P2</tspan></text><rect class="node" x="355" y="925" width="250" height="150"/><text class="label" x="480" y="958"><tspan x="480">Mover</tspan></text><text class="sub" x="480" y="983"><tspan x="480">Update attributes</tspan><tspan x="480" dy="19">add new department access</tspan><tspan x="480" dy="19">remove obsolete department access</tspan></text><rect class="node" x="655" y="925" width="250" height="150"/><text class="label" x="780" y="958"><tspan x="780">Leaver</tspan></text><text class="sub" x="780" y="983"><tspan x="780">Remove managed access</tspan><tspan x="780" dy="19">reclaim Entra ID P2</tspan><tspan x="780" dy="19">disable account</tspan></text>
    <text class="note" x="58" y="1112">
      Every lifecycle action writes a structured audit record with timestamp, event, user, result, and message.
