<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 860"
  role="img"
  aria-labelledby="svg-title svg-desc"
>
<title id="svg-title">IAM-01 Zero Trust Identity Architecture</title>
<desc id="svg-desc">Separate sign-in protection and privileged access paths using Microsoft Entra Conditional Access, Identity Protection, and Privileged Identity Management.</desc>

<style>
.bg {
  fill: #161b21;
}
.panel {
  fill: #12161b;
  stroke: #655236;
  stroke-width: 1;
}
.node {
  fill: #1b1916;
  stroke: #9c7433;
  stroke-width: 1.2;
}
.title {
  fill: #efcf88;
  font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-anchor: middle;
}
.label {
  fill: #f2eee7;
  font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-anchor: middle;
}
.sub {
  fill: #a89f92;
  font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-anchor: middle;
}
.note {
  fill: #a89f92;
  font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.arrow {
  stroke: #d4aa55;
  stroke-width: 2.5;
  fill: none;
}
</style>

<defs>
  <marker
    id="arrowhead"
    markerWidth="8"
    markerHeight="8"
    refX="6"
    refY="3"
    orient="auto"
  >
    <path d="M0,0 L0,6 L6,3 z" fill="#d4aa55"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="860"/>

    <rect class="panel" x="35" y="30" width="425" height="800"/>
    <text class="title" x="247.5" y="66">
      SIGN-IN PROTECTION PATH
    </text>
  <rect class="node" x="85" y="95" width="325" height="88"/><text class="label" x="247.5" y="128"><tspan x="247.5">User Sign-in</tspan></text><text class="sub" x="247.5" y="153"><tspan x="247.5">Workforce or administrator identity</tspan></text><line
    class="arrow"
    x1="247.5"
    y1="183"
    x2="247.5"
    y2="215"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="85" y="225" width="325" height="88"/><text class="label" x="247.5" y="258"><tspan x="247.5">Microsoft Entra ID</tspan></text><text class="sub" x="247.5" y="283"><tspan x="247.5">Authentication control plane</tspan></text><line
    class="arrow"
    x1="247.5"
    y1="313"
    x2="247.5"
    y2="345"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="85" y="355" width="325" height="88"/><text class="label" x="247.5" y="388"><tspan x="247.5">Identity Protection Signals</tspan></text><text class="sub" x="247.5" y="413"><tspan x="247.5">User risk · sign-in risk</tspan></text><line
    class="arrow"
    x1="247.5"
    y1="443"
    x2="247.5"
    y2="475"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="85" y="485" width="325" height="105"/><text class="label" x="247.5" y="518"><tspan x="247.5">Conditional Access Evaluation</tspan></text><text class="sub" x="247.5" y="543"><tspan x="247.5">Risk · user/role · resource · client app</tspan></text><line
    class="arrow"
    x1="247.5"
    y1="590"
    x2="247.5"
    y2="622"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="85" y="632" width="325" height="105"/><text class="label" x="247.5" y="665"><tspan x="247.5">Report-only Validation</tspan></text><text class="sub" x="247.5" y="690"><tspan x="247.5">MFA · phishing-resistant auth</tspan><tspan x="247.5" dy="19">legacy authentication block</tspan></text>
    <text class="sub" x="247.5" y="785">
      <tspan x="247.5">
        Emergency administrator accounts excluded from applicable
      </tspan>
      <tspan x="247.5" dy="19">
        restrictive Conditional Access policies.
      </tspan>
    </text>
  
    <rect class="panel" x="500" y="30" width="425" height="800"/>
    <text class="title" x="712.5" y="66">
      PRIVILEGED ACCESS PATH
    </text>
  <rect class="node" x="550" y="95" width="325" height="88"/><text class="label" x="712.5" y="128"><tspan x="712.5">Eligible Administrator</tspan></text><text class="sub" x="712.5" y="153"><tspan x="712.5">No standing active privileged role</tspan></text><line
    class="arrow"
    x1="712.5"
    y1="183"
    x2="712.5"
    y2="211"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="550" y="219" width="325" height="88"/><text class="label" x="712.5" y="252"><tspan x="712.5">PIM Role Eligibility</tspan></text><text class="sub" x="712.5" y="277"><tspan x="712.5">Privileged Role Administrator</tspan></text><line
    class="arrow"
    x1="712.5"
    y1="307"
    x2="712.5"
    y2="335"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="550" y="343" width="325" height="88"/><text class="label" x="712.5" y="376"><tspan x="712.5">Activation Request</tspan></text><text class="sub" x="712.5" y="401"><tspan x="712.5">Requested only when privileged work is needed</tspan></text><line
    class="arrow"
    x1="712.5"
    y1="431"
    x2="712.5"
    y2="459"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="550" y="467" width="325" height="88"/><text class="label" x="712.5" y="500"><tspan x="712.5">MFA + Justification</tspan></text><text class="sub" x="712.5" y="525"><tspan x="712.5">Activation controls</tspan></text><line
    class="arrow"
    x1="712.5"
    y1="555"
    x2="712.5"
    y2="583"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="550" y="591" width="325" height="88"/><text class="label" x="712.5" y="624"><tspan x="712.5">Time-Bound Privilege</tspan></text><text class="sub" x="712.5" y="649"><tspan x="712.5">Active for up to 1 hour</tspan></text><line
    class="arrow"
    x1="712.5"
    y1="679"
    x2="712.5"
    y2="707"
    marker-end="url(#arrowhead)"
  /><rect class="node" x="550" y="715" width="325" height="105"/><text class="label" x="712.5" y="748"><tspan x="712.5">Automatic Expiration</tspan></text><text class="sub" x="712.5" y="773"><tspan x="712.5">Active assignment removed after activation window</tspan></text>
</svg>